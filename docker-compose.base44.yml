# Base44 sandbox development stack for Online VM.
#
# Both projects run from the cloned source with live reload (bind mounts +
# uvicorn --reload / Vite dev server), so edits in the editor show up in the
# preview without rebuilding. The repository's own docker-compose.yml is NOT
# used here: it builds production images (nginx + prebuilt frontend bundle).
#
#   web  (Vite dev server, host port 3000) -> proxy /api and /ws -> api (FastAPI, 8000)
#
# Usage: docker compose -f docker-compose.base44.yml up -d --build
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.base44
    labels:
      base44.project: "Backend API"
      base44.kind: "api"
      base44.port: "8000"
      base44.docs: "/docs"
    working_dir: /app
    command:
      - sh
      - -ec
      - >-
        pip install --no-cache-dir -q -r requirements.txt &&
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    volumes:
      - ./backend:/app
      - vm_data:/data
      # Docker tab: the API talks to the host's Docker Engine over this socket
      # (read/write — it starts/stops containers). Without it the Docker tab
      # reports "not available" and the rest of the app works normally.
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      # Platform-delivered secrets, e.g. OPENAI_API_KEY for the AI assistant.
      - path: /run/base44/app.env
        required: false
    # Lets the API create /dev/kvm itself when the host kernel exposes KVM
    # (qemu_service._ensure_kvm_device) — so hardware acceleration works on any
    # KVM-capable host with no compose edit. The rule covers only the KVM
    # character device and is inert on hosts without KVM.
    device_cgroup_rules:
      - "c 10:232 rwm"
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONUNBUFFERED=1
      # Bind mounts do not always emit inotify events; poll so --reload fires.
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: on-failure

  web:
    image: node:22-alpine
    labels:
      base44.project: "Web UI"
      base44.kind: "web"
      base44.port: "3000"
    working_dir: /app
    command:
      - sh
      - -ec
      - >-
        npm install --no-audit --no-fund &&
        exec npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      # Keep the dependency tree in a volume: writable, cached across restarts
      # and out of the user's working tree.
      - web_node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      # Read by frontend/vite.config.js to allow the proxied preview host
      # (only when BASE44_PREVIEW_MODE is exactly "1").
      - BASE44_SANDBOX_HOST_DOMAIN
      # Proxy targets for the container network (see frontend/vite.config.js).
      - VITE_API_PROXY_TARGET=http://api:8000
      - VITE_WS_PROXY_TARGET=ws://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than localhost: Vite binds 0.0.0.0 (IPv4) while
      # localhost resolves to ::1 inside this image, which refuses.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: on-failure

  swap:
    # Backing store for guest RAM above the host's physical memory: this sandbox
    # has 8 GB, so the 16 GB VM ceiling only works with swap behind it. Without
    # it QEMU is OOM-killed as soon as the guest touches those pages.
    # `swapon` needs CAP_SYS_ADMIN, which only a privileged container gets — this
    # service does nothing else and is not routed to the browser.
    image: debian:12-slim
    labels:
      base44.project: "VM swap"
      base44.kind: "infra"
    privileged: true
    working_dir: /data
    command:
      - sh
      - -ec
      - |
        if [ ! -f /data/swapfile ]; then
          fallocate -l "$${SWAP_MB:-11264}M" /data/swapfile
          chmod 600 /data/swapfile
          mkswap /data/swapfile >/dev/null
        fi
        grep -q /data/swapfile /proc/swaps || swapon /data/swapfile
        exec sleep infinity
    volumes:
      - vm_data:/data
    healthcheck:
      # `/proc/swaps` is kernel-wide, so this is the same view the API reads.
      test: ["CMD-SHELL", "grep -qs /data/swapfile /proc/swaps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure

volumes:
  # VM definitions (/data/vms.json), disk images, uploaded ISOs and the
  # /data/swapfile backing guest RAM.
  vm_data:
  web_node_modules:
