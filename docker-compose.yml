version: '3.9'
services:
  backend:
    build: ./backend
    container_name: online-vm-backend
    ports:
      - "8000:8000"
    volumes:
      - vm_data:/data
    devices:
      - /dev/kvm:/dev/kvm
    privileged: true
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: online-vm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  vm_data:
    driver: local
